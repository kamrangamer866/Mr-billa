<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR BILLA DLR - Admin Login</title>

<link rel="stylesheet" href="Style.css">

</head>

<body>

<div class="card">

<h1>🔐 ADMIN LOGIN</h1>

<form id="loginForm">

<input
    type="email"
    id="email"
    class="input-box"
    placeholder="Enter Email"
    required
>

<br><br>

<input
    type="password"
    id="password"
    class="input-box"
    placeholder="Enter Password"
    required
>

<br><br>

<button type="submit" class="start-btn">
LOGIN
</button>

</form>

<p id="message"></p>

<br>

<a href="signup.html" class="signup-btn">
SIGN UP
</a>

<br><br>

<a href="index.html" class="start-btn">
BACK
</a>

<footer>
© 2026 MR BILLA DLR
</footer>

</div>


<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

const loginForm =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
            .value
            .trim();

        const password =
            document.getElementById("password")
            .value;


        message.textContent =
            "Logging in...";


        try {

            if (typeof supabase === "undefined") {

                message.textContent =
                    "❌ Supabase connection not found.";

                return;
            }


            const { data, error } =
                await supabase.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                message.textContent =
                    "❌ " + error.message;

                return;
            }


            if (!data.session) {

                message.textContent =
                    "❌ Login session was not created.";

                return;
            }


            message.textContent =
                "✅ Login successful!";


            setTimeout(function() {

                window.location.href =
                    "admin.html";

            }, 500);


        } catch (error) {

            console.error(error);

            message.textContent =
                "❌ " + error.message;

        }

    }

);

</script>

</body>
</html>
