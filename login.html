<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR BILLA DLR - Admin Login</title>

<link rel="stylesheet" href="Style.css">
</head>

<body>

<div class="card">

<h1>🔐 ADMIN LOGIN</h1>

<form id="loginForm">

<input
    type="email"
    id="email"
    class="input-box"
    placeholder="Enter Admin Email"
    required
>

<br><br>

<input
    type="password"
    id="password"
    class="input-box"
    placeholder="Enter Password"
    required
>

<br><br>

<button type="submit" class="start-btn">
LOGIN
</button>

</form>

<p id="message"></p>

<br>

<button
    type="button"
    onclick="forgotPassword()"
    class="signup-btn">

FORGOT PASSWORD?

</button>

<br><br>

<a href="index.html" class="start-btn">
BACK
</a>

<footer>
© 2026 MR BILLA DLR
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

const ADMIN_EMAIL = "kamrangamer866@gmail.com";

const loginForm =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();

    const password =
        document.getElementById("password")
        .value;


    if (email !== ADMIN_EMAIL) {

        message.textContent =
            "❌ Only Admin can login.";

        return;
    }


    message.textContent =
        "Logging in...";


    try {

        const {
            data,
            error
        } = await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

        });


        if (error) {

            message.textContent =
                "❌ " + error.message;

            return;
        }


        if (!data.session) {

            message.textContent =
                "❌ Login session not created.";

            return;
        }


        message.textContent =
            "✅ Login successful!";


        window.location.href = "admin.html";

    } catch (error) {

        console.error(error);

        message.textContent =
            "❌ " + error.message;

    }

});


async function forgotPassword() {

    const email =
        document.getElementById("email")
        .value
        .trim()
        .toLowerCase();


    if (email !== ADMIN_EMAIL) {

        message.textContent =
            "❌ Enter the Admin email first.";

        return;
    }


    message.textContent =
        "Sending reset email...";


    try {

        const {
            error
        } =
        await supabaseClient.auth.resetPasswordForEmail(

            ADMIN_EMAIL,

            {
                redirectTo:
                    "https://mr-billa-dlr.vercel.app"
            }

        );


        if (error) {

            message.textContent =
                "❌ " + error.message;

            return;
        }


        message.textContent =
            "✅ Check your Gmail for the password reset email.";

    } catch (error) {

        message.textContent =
            "❌ " + error.message;

    }

}

</script>

</body>
</html>
