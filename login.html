<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MR BILLA DLR - Admin Login</title>

<link rel="stylesheet"
      href="Style.css">

</head>


<body>


<div class="card">


<h1>🔐 ADMIN LOGIN</h1>


<form id="loginForm">


<input
    type="email"
    id="email"
    class="input-box"
    placeholder="Enter Email"
    required
>


<br><br>


<input
    type="password"
    id="password"
    class="input-box"
    placeholder="Enter Password"
    required
>


<br><br>


<button
    type="submit"
    class="start-btn">

LOGIN

</button>


</form>


<p id="message"></p>


<br>


<button
    type="button"
    onclick="forgotPassword()"
    class="signup-btn">

FORGOT PASSWORD?

</button>


<br><br>


<a href="signup.html"
   class="signup-btn">

SIGN UP

</a>


<br><br>


<a href="index.html"
   class="start-btn">

BACK

</a>


<footer>

© 2026 MR BILLA DLR

</footer>


</div>



<!-- Supabase Library -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- Supabase Connection -->

<script src="supabase.js"></script>



<script>


const loginForm =
    document.getElementById("loginForm");


const message =
    document.getElementById("message");



// ============================
// LOGIN
// ============================

loginForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        message.textContent =
            "Logging in...";


        try {


            if (
                typeof supabaseClient ===
                "undefined"
            ) {

                message.textContent =
                    "❌ Supabase connection not found.";

                return;

            }


            const { data, error } =
                await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                message.textContent =
                    "❌ " + error.message;

                return;

            }


            if (!data.session) {

                message.textContent =
                    "❌ Login session was not created.";

                return;

            }


            message.textContent =
                "✅ Login successful!";


            setTimeout(function() {

                window.location.href =
                    "admin.html";

            }, 500);


        }

        catch (error) {

            console.error(error);

            message.textContent =
                "❌ " + error.message;

        }

    }

);



// ============================
// FORGOT PASSWORD
// ============================

async function forgotPassword() {


    const email =
        document
        .getElementById("email")
        .value
        .trim();


    if (!email) {

        message.textContent =
            "❌ Pehle apni email enter karo.";

        return;

    }


    message.textContent =
        "Sending password reset email...";


    try {


        if (
            typeof supabaseClient ===
            "undefined"
        ) {

            message.textContent =
                "❌ Supabase connection not found.";

            return;

        }


        const { error } =
            await supabaseClient.auth
            .resetPasswordForEmail(
                email,
                {
                    redirectTo:
                        window.location.origin +
                        "/reset-password.html"
                }
            );


        if (error) {

            message.textContent =
                "❌ " + error.message;

            return;

        }


        message.textContent =
            "✅ Password reset email sent! Apni email check karo.";


    }

    catch (error) {

        console.error(error);

        message.textContent =
            "❌ " + error.message;

    }

}


</script>


</body>

</html>
