
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR BILLA DLR - Gallery</title>

<link rel="stylesheet" href="Style.css">

</head>

<body>

<div class="card">

<h1>🔥 MR BILLA DLR 🔥</h1>


<h2>📸 Pictures</h2>

<div id="images">
Loading pictures...
</div>


<h2>🎬 Videos</h2>

<div id="videos">
Loading videos...
</div>


<br><br>

<a href="index.html" class="start-btn">
BACK
</a>


<footer>
© 2026 MR BILLA DLR
</footer>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>

async function loadGallery() {

    const images =
        document.getElementById("images");

    const videos =
        document.getElementById("videos");


    /*
     * IMAGES
     */

    const {
        data: imageFiles,
        error: imageError
    } =
        await supabaseClient.storage
        .from("uploads")
        .list("images", {

            limit: 100,

            sortBy: {
                column: "created_at",
                order: "desc"
            }

        });


    if (imageError) {

        images.innerHTML =
            "❌ Pictures load nahi ho sakin.";

    }

    else if (
        !imageFiles ||
        imageFiles.length === 0
    ) {

        images.innerHTML =
            "No pictures uploaded yet.";

    }

    else {

        images.innerHTML = "";


        imageFiles.forEach(
            function(file) {

                const {
                    data
                } =
                    supabaseClient.storage
                    .from("uploads")
                    .getPublicUrl(
                        "images/" +
                        file.name
                    );


                const img =
                    document
                    .createElement("img");


                img.src =
                    data.publicUrl;


                img.className =
                    "gallery-img";


                images.appendChild(img);

            }
        );

    }


    /*
     * VIDEOS
     */

    const {
        data: videoFiles,
        error: videoError
    } =
        await supabaseClient.storage
        .from("uploads")
        .list("videos", {

            limit: 100,

            sortBy: {
                column: "created_at",
                order: "desc"
            }

        });


    if (videoError) {

        videos.innerHTML =
            "❌ Videos load nahi ho sakin.";

    }

    else if (
        !videoFiles ||
        videoFiles.length === 0
    ) {

        videos.innerHTML =
            "No videos uploaded yet.";

    }

    else {

        videos.innerHTML = "";


        videoFiles.forEach(
            function(file) {

                const {
                    data
                } =
                    supabaseClient.storage
                    .from("uploads")
                    .getPublicUrl(
                        "videos/" +
                        file.name
                    );


                const video =
                    document
                    .createElement("video");


                video.src =
                    data.publicUrl;


                video.className =
                    "gallery-video";


                video.controls =
                    true;


                video.playsInline =
                    true;


                videos.appendChild(video);


                videos.appendChild(
                    document
                    .createElement("br")
                );


            }
        );

    }

}


loadGallery();

</script>

</body>
</html>
