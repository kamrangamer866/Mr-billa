<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MR BILLA DLR - Gallery</title>

<link rel="stylesheet"
      href="Style.css">

</head>


<body>


<div class="card">


<h1>🔥 MR BILLA DLR 🔥</h1>


<h2>Pictures</h2>

<div id="images">
    Loading pictures...
</div>


<h2>Videos</h2>

<div id="videos">
    Loading videos...
</div>


<br><br>


<a href="index.html"
   class="start-btn">

BACK

</a>


<footer>

© 2026 MR BILLA DLR

</footer>


</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>


async function loadGallery() {


    const images =
        document.getElementById("images");

    const videos =
        document.getElementById("videos");


    // =========================
    // LOAD PICTURES
    // =========================

    const { data: imageFiles, error: imageError } =
        await supabase.storage
        .from("uploads")
        .list("images", {
            limit: 100,
            sortBy: {
                column: "created_at",
                order: "desc"
            }
        });


    if (imageError) {

        images.innerHTML =
            "❌ Pictures load nahi ho sakin.";

        console.error(imageError);

    }

    else if (!imageFiles || imageFiles.length === 0) {

        images.innerHTML =
            "No pictures uploaded yet.";

    }

    else {

        images.innerHTML = "";


        imageFiles.forEach(function(file) {


            const { data } =
                supabase.storage
                .from("uploads")
                .getPublicUrl(
                    "images/" + file.name
                );


            const img =
                document.createElement("img");


            img.src = data.publicUrl;

            img.className =
                "gallery-img";

            img.alt =
                "MR BILLA DLR";


            images.appendChild(img);


            images.appendChild(
                document.createElement("br")
            );

        });

    }



    // =========================
    // LOAD VIDEOS
    // =========================

    const { data: videoFiles, error: videoError } =
        await supabase.storage
        .from("uploads")
        .list("videos", {
            limit: 100,
            sortBy: {
                column: "created_at",
                order: "desc"
            }
        });


    if (videoError) {

        videos.innerHTML =
            "❌ Videos load nahi ho sakin.";

        console.error(videoError);

    }

    else if (!videoFiles || videoFiles.length === 0) {

        videos.innerHTML =
            "No videos uploaded yet.";

    }

    else {

        videos.innerHTML = "";


        videoFiles.forEach(function(file) {


            const { data } =
                supabase.storage
                .from("uploads")
                .getPublicUrl(
                    "videos/" + file.name
                );


            const video =
                document.createElement("video");


            video.className =
                "gallery-video";

            video.controls = true;

            video.playsInline = true;


            const source =
                document.createElement("source");


            source.src =
                data.publicUrl;

            source.type =
                "video/mp4";


            video.appendChild(source);


            videos.appendChild(video);


            videos.appendChild(
                document.createElement("br")
            );

            videos.appendChild(
                document.createElement("br")
            );

        });

    }

}


loadGallery();

</script>


</body>

</html>
