<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MR BILLA DLR - Admin Dashboard</title>

<link rel="stylesheet" href="Style.css">

</head>

<body>

<div class="card">

<h1>🔥 MR BILLA DLR 🔥</h1>

<h2>🔐 ADMIN DASHBOARD</h2>

<p id="adminEmail"></p>

<hr>
    <h3>📂 Upload Product Media (Maximum 5)</h3>

<input
type="file"
id="mediaFiles"
class="input-box"
accept="image/*,video/*"
multiple>

<br><br>

<button
onclick="uploadMedia()"
class="signup-btn">

📤 Upload Media

</button>

<br><br>

<div id="mediaPreview"></div>

<p id="message"></p>

<hr>

<h3>📦 Product Name</h3>

<input
type="text"
id="productName"
class="input-box"
placeholder="Enter Product Name">

<br><br>

<h3>💰 Product Price</h3>

<input
type="text"
id="productPrice"
class="input-box"
placeholder="Enter Product Price">

<br><br>

<h3>📝 Product Description</h3>

<textarea
id="productDescription"
class="input-box"
rows="4"
placeholder="Enter Product Description"></textarea>

<br><br>

<h3>📸 Product Photos</h3>

<input
type="file"
id="imageFile"
class="input-box"
accept="image/*"
multiple>

<br><br>

<h3>🎥 Product Videos</h3>

<input
type="file"
id="videoFile"
class="input-box"
accept="video/*"
multiple>

<br><br>

<button
class="signup-btn"
onclick="saveProduct()">

💾 SAVE PRODUCT

</button>

<br><br>

<p id="message"></p>

<br>

<a href="Gallery.html"
class="start-btn">

VIEW GALLERY

</a>

<br><br>

<button
onclick="logout()"
class="start-btn">

LOGOUT

</button>

<footer>

© 2026 MR BILLA DLR

</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script>

const CLOUD_NAME="edquri0f";

const UPLOAD_PRESET="Mr billa 11";

const ADMIN_EMAIL="kamrangamer866@gmail.com";

async function checkAdmin(){
    let uploadedMedia = [];

async function uploadMedia() {

const files = document.getElementById("mediaFiles").files;

const preview = document.getElementById("mediaPreview");

const message = document.getElementById("message");

preview.innerHTML = "";

uploadedMedia = [];

if (files.length == 0) {

message.textContent = "❌ Select at least one file";

return;

}

if (files.length > 5) {

message.textContent = "❌ Maximum 5 files allowed";

return;

}

message.textContent = "Uploading...";

for (const file of files) {

const formData = new FormData();

formData.append("file", file);

formData.append("upload_preset", UPLOAD_PRESET);

const type = file.type.startsWith("video")
? "video"
: "image";

const response = await fetch(

`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${type}/upload`,

{

method: "POST",

body: formData

}

);

const result = await response.json();

if (result.secure_url) {

uploadedMedia.push({

type: type,

url: result.secure_url

});

if (type == "image") {

preview.innerHTML += `<img src="${result.secure_url}" width="120">`;

} else {

preview.innerHTML += `<video src="${result.secure_url}" width="120" controls></video>`;

}

}

}

message.textContent = "✅ Media Uploaded";

}

const {data,error}=await supabaseClient.auth.getSession();

if(error || !data.session){

window.location.href="login.html";

return;

}

const email=data.session.user.email.toLowerCase();

if(email!==ADMIN_EMAIL){

await supabaseClient.auth.signOut();

window.location.href="login.html";

return;

}

document.getElementById("adminEmail").innerText="Logged in as: "+email;

}

checkAdmin();
    async function uploadToCloudinary(file,type){

const formData=new FormData();

formData.append("file",file);

formData.append("upload_preset",UPLOAD_PRESET);

const response=await fetch(
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${type}/upload`,
{
method:"POST",
body:formData
});

const result=await response.json();

if(result.secure_url){

return result.secure_url;

}else{

throw new Error(result.error?.message || "Upload Failed");

}

}

async function uploadFiles(files,type){

const urls=[];

for(const file of files){

const url=await uploadToCloudinary(file,type);

urls.push(url);

}

return urls;

}
    async function saveProduct(){

const message=document.getElementById("message");

const name=document.getElementById("productName").value.trim();

const price=document.getElementById("productPrice").value.trim();

const description=document.getElementById("productDescription").value.trim();

const imageFiles=document.getElementById("imageFile").files;

const videoFiles=document.getElementById("videoFile").files;

if(name===""){

message.textContent="❌ Enter Product Name";

return;

}

message.textContent="Uploading files...";

try{

const imageUrls=await uploadFiles(imageFiles,"image");

const videoUrls=await uploadFiles(videoFiles,"video");

const {error}=await supabaseClient
.from("products")
.insert([{

name:name,

price:price,

description:description,

image_urls:imageUrls,

video_urls:videoUrls,

views:0

}]);

if(error){

message.textContent="❌ "+error.message;

return;

}

message.textContent="✅ Product Saved Successfully";

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productDescription").value="";
document.getElementById("imageFile").value="";
document.getElementById("videoFile").value="";

}catch(err){

message.textContent="❌ "+err.message;

}

    }
    async function logout(){

await supabaseClient.auth.signOut();

window.location.href="index.html";

}

</script>

</body>

</html>
