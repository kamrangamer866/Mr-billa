<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR BILLA DLR - Admin Dashboard</title>

<link rel="stylesheet" href="Style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

</head>

<body>

<div class="card">

<h1>🔥 MR BILLA DLR 🔥</h1>

<h2>🔐 ADMIN DASHBOARD</h2>

<h3>📦 PRODUCT DETAILS</h3>

<input
type="text"
id="productName"
class="input-box"
placeholder="Product Name">

<br><br>

<input
type="text"
id="productPrice"
class="input-box"
placeholder="Product Price">

<br><br>

<textarea
id="productDescription"
class="input-box"
rows="4"
placeholder="Product Description"></textarea>

<br><br>

<h3>📁 Upload Media 1</h3>

<input
type="file"
id="media1"
accept="image/*,video/*">

<br><br>

<h3>📁 Upload Media 2</h3>

<input
type="file"
id="media2"
accept="image/*,video/*">

<br><br>

<h3>📁 Upload Media 3</h3>

<input
type="file"
id="media3"
accept="image/*,video/*">

<br><br>

<h3>📁 Upload Media 4</h3>

<input
type="file"
id="media4"
accept="image/*,video/*">

<br><br>

<h3>📁 Upload Media 5</h3>

<input
type="file"
id="media5"
accept="image/*,video/*">

<br><br>

<p id="message"></p>
<button
class="signup-btn"
onclick="saveProduct()">

💾 SAVE PRODUCT

</button>

<br><br>

<a
href="Gallery.html"
class="start-btn">

📦 VIEW GALLERY

</a>

<br><br>

<button
class="start-btn"
onclick="logout()">

🚪 LOGOUT

</button>

<br><br>

<footer>

© 2026 MR BILLA DLR

</footer>

</div>

<script>

const CLOUD_NAME = "edquri0f";
const UPLOAD_PRESET = "Mr billa 11";
const ADMIN_EMAIL = "kamrangamer866@gmail.com";

let uploadedMedia = [];

async function checkAdmin(){

const { data } = await supabaseClient.auth.getSession();

if(!data.session){

window.location.href = "login.html";

return;

}

}

checkAdmin();
    async function uploadAllMedia(){

uploadedMedia=[];

const message=document.getElementById("message");

message.textContent="⏳ Uploading media...";

for(let i=1;i<=5;i++){

const input=document.getElementById("media"+i);

if(!input || input.files.length===0){

continue;

}

const file=input.files[0];

const formData=new FormData();

formData.append("file",file);

formData.append("upload_preset",UPLOAD_PRESET);

const folder=file.type.startsWith("video")
? "video"
: "image";

const response=await fetch(
`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${folder}/upload`,
{
method:"POST",
body:formData
});

const result=await response.json();

if(result.secure_url){

uploadedMedia.push({

type:folder,

url:result.secure_url

});

}else{

throw new Error(result.error?.message || "Upload Failed");

}

}

message.textContent="✅ Media Uploaded";

    }
    async function saveProduct(){

const name=document.getElementById("productName").value.trim();
const price=document.getElementById("productPrice").value.trim();
const description=document.getElementById("productDescription").value.trim();

const message=document.getElementById("message");

if(name===""){

message.textContent="❌ Enter Product Name";

return;

}

try{

await uploadAllMedia();

const {error}=await supabaseClient
.from("products")
.insert([{

name:name,

price:price,

description:description,

media:uploadedMedia,

views:0

}]);

if(error){

message.textContent="❌ "+error.message;

return;

}

message.textContent="✅ Product Saved Successfully";

document.getElementById("productName").value="";
document.getElementById("productPrice").value="";
document.getElementById("productDescription").value="";

for(let i=1;i<=5;i++){

document.getElementById("media"+i).value="";

}

uploadedMedia=[];

}catch(err){

message.textContent="❌ "+err.message;

}

}

async function logout(){

await supabaseClient.auth.signOut();

window.location.href="index.html";

}

</script>

</body>

</html>
