<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR BILLA DLR - Admin Dashboard</title>

<link rel="stylesheet" href="Style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<style>

.admin-product{
    margin-top:30px;
    padding:20px;
    border:2px solid #00e676;
    border-radius:15px;
    background:#111;
}

.admin-product h2{
    color:#00e676;
}

.media-box{
    margin-top:20px;
    padding:15px;
    border:1px solid #444;
    border-radius:12px;
    background:#181818;
}

.media-box img,
.media-box video{
    width:100%;
    max-height:350px;
    object-fit:contain;
    border-radius:10px;
    margin-top:10px;
}

.media-detail{
    margin-top:10px;
    padding:12px;
    background:#222;
    border-radius:10px;
    color:white;
}

.delete-product{
    background:red !important;
    color:white !important;
    border:none;
    margin-top:20px;
}

#adminProducts{
    margin-top:30px;
}

</style>

</head>


<body>


<div class="card">


<h1>🔥 MR BILLA DLR 🔥</h1>

<h2>🔐 ADMIN DASHBOARD</h2>


<h3>📦 ADD NEW PRODUCT</h3>


<input
type="text"
id="productName"
class="input-box"
placeholder="Product Name">

<br><br>


<input
type="text"
id="productPrice"
class="input-box"
placeholder="Product Price">

<br><br>


<textarea
id="productDescription"
class="input-box"
rows="4"
placeholder="Product Description"></textarea>


<br><br>


<!-- MEDIA 1 -->

<h3>📁 Media 1</h3>

<input
type="file"
id="media1"
accept="image/*,video/*">

<br><br>

<textarea
id="detail1"
class="input-box"
rows="3"
placeholder="Media 1 ki detail / message"></textarea>


<br><br>


<!-- MEDIA 2 -->

<h3>📁 Media 2</h3>

<input
type="file"
id="media2"
accept="image/*,video/*">

<br><br>

<textarea
id="detail2"
class="input-box"
rows="3"
placeholder="Media 2 ki detail / message"></textarea>


<br><br>


<!-- MEDIA 3 -->

<h3>📁 Media 3</h3>

<input
type="file"
id="media3"
accept="image/*,video/*">

<br><br>

<textarea
id="detail3"
class="input-box"
rows="3"
placeholder="Media 3 ki detail / message"></textarea>


<br><br>


<!-- MEDIA 4 -->

<h3>📁 Media 4</h3>

<input
type="file"
id="media4"
accept="image/*,video/*">

<br><br>

<textarea
id="detail4"
class="input-box"
rows="3"
placeholder="Media 4 ki detail / message"></textarea>


<br><br>


<!-- MEDIA 5 -->

<h3>📁 Media 5</h3>

<input
type="file"
id="media5"
accept="image/*,video/*">

<br><br>

<textarea
id="detail5"
class="input-box"
rows="3"
placeholder="Media 5 ki detail / message"></textarea>


<br><br>


<p id="message"></p>


<button
class="signup-btn"
onclick="saveProduct()">

💾 SAVE PRODUCT

</button>


<br><br>


<a
href="Gallery.html"
class="start-btn">

📦 VIEW PUBLIC GALLERY

</a>


<br><br>


<button
class="start-btn"
onclick="logout()">

🚪 LOGOUT

</button>


<hr>

<h2>📦 SAVED PRODUCTS</h2>

<div id="adminProducts">

<p>Loading Products...</p>

</div>


<br>


<footer>

© 2026 MR BILLA DLR

</footer>


</div>



<script>


const CLOUD_NAME = "edquri0f";

const UPLOAD_PRESET = "Mr billa 11";

const ADMIN_EMAIL = "kamrangamer866@gmail.com";


let uploadedMedia = [];



/* =========================
   CHECK ADMIN LOGIN
========================= */


async function checkAdmin(){

const { data, error } =
await supabaseClient.auth.getSession();


if(error){

console.error(error);

window.location.href="login.html";

return;

}


if(!data.session){

window.location.href="login.html";

return;

}


const email =
data.session.user.email.toLowerCase();


if(email !== ADMIN_EMAIL.toLowerCase()){

alert("❌ Admin Access Only");

await supabaseClient.auth.signOut();

window.location.href="index.html";

return;

}

}


checkAdmin();



/* =========================
   UPLOAD ALL MEDIA
========================= */


async function uploadAllMedia(){

uploadedMedia=[];


const message =
document.getElementById("message");


message.textContent =
"⏳ Uploading media...";


for(let i=1;i<=5;i++){


const input =
document.getElementById("media"+i);


const detail =
document.getElementById("detail"+i);


if(!input || input.files.length===0){

continue;

}


const file =
input.files[0];


const mediaDetail =
detail.value.trim();


const formData =
new FormData();


formData.append("file",file);

formData.append(
"upload_preset",
UPLOAD_PRESET
);


const folder =
file.type.startsWith("video")
? "video"
: "image";


const response =
await fetch(

`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${folder}/upload`,

{
method:"POST",
body:formData
}

);


const result =
await response.json();


if(result.secure_url){


uploadedMedia.push({

type:folder,

url:result.secure_url,

detail:mediaDetail

});


}else{


throw new Error(

result.error?.message ||
"Media Upload Failed"

);

}

}


message.textContent =
"✅ Media Uploaded Successfully";

}



/* =========================
   SAVE PRODUCT
========================= */


async function saveProduct(){


const name =
document
.getElementById("productName")
.value
.trim();


const price =
document
.getElementById("productPrice")
.value
.trim();


const description =
document
.getElementById("productDescription")
.value
.trim();


const message =
document.getElementById("message");


if(name===""){

message.textContent =
"❌ Enter Product Name";

return;

}


try{


await uploadAllMedia();


if(uploadedMedia.length===0){

message.textContent =
"❌ Please upload at least one photo or video";

return;

}


message.textContent =
"⏳ Saving Product...";


const { error } =
await supabaseClient

.from("products")

.insert([{

name:name,

price:price,

description:description,

media:uploadedMedia,

views:0

}]);


if(error){

message.textContent =
"❌ "+error.message;

return;

}


message.textContent =
"✅ Product Saved Successfully";


/* CLEAR FORM */


document
.getElementById("productName")
.value="";


document
.getElementById("productPrice")
.value="";


document
.getElementById("productDescription")
.value="";


for(let i=1;i<=5;i++){

document
.getElementById("media"+i)
.value="";

document
.getElementById("detail"+i)
.value="";

}


uploadedMedia=[];


/* REFRESH ADMIN PRODUCTS */

loadAdminProducts();


}catch(err){


console.error(err);


message.textContent =
"❌ "+err.message;

}

}



/* =========================
   LOAD ADMIN PRODUCTS
========================= */


async function loadAdminProducts(){


const container =
document.getElementById("adminProducts");


container.innerHTML =
"<p>⏳ Loading Products...</p>";


const { data,error } =
await supabaseClient

.from("products")

.select("*")

.order("id",{ascending:false});


if(error){

console.error(error);

container.innerHTML =
"<p>❌ Failed to load products</p>";

return;

}


if(!data || data.length===0){

container.innerHTML =
"<p>📦 No Products Found</p>";

return;

}


container.innerHTML="";


data.forEach((product,index)=>{


const productBox =
document.createElement("div");


productBox.className =
"admin-product";


let mediaHTML="";


const media =
Array.isArray(product.media)
? product.media
: [];


media.forEach((item,mediaIndex)=>{


const number =
mediaIndex+1;


let mediaContent="";


if(item.type==="image"){

mediaContent = `

<img
src="${item.url}"
alt="Product Media">

`;

}


else if(item.type==="video"){

mediaContent = `

<video controls>

<source
src="${item.url}"
type="video/mp4">

Your browser does not support video.

</video>

`;

}


mediaHTML += `

<div class="media-box">

<h3>📁 Media ${number}</h3>

${mediaContent}

<div class="media-detail">

<b>📝 Detail:</b>

<p>
${item.detail || "No detail added"}
</p>

</div>

</div>

`;

});


productBox.innerHTML = `

<h2>
📦 Product ${index+1}
</h2>

<h3>
${product.name || ""}
</h3>

<p>
<b>💰 Price:</b>
${product.price || ""}
</p>

<p>
<b>📝 Product Description:</b>
</p>

<p>
${product.description || ""}
</p>

${mediaHTML}

<p>
<b>👁️ Views:</b>
${product.views || 0}
</p>

<button
class="signup-btn delete-product"
onclick="deleteProduct(${product.id})">

🗑️ DELETE PRODUCT

</button>

`;


container.appendChild(productBox);

});

}



/* =========================
   DELETE PRODUCT
========================= */


async function deleteProduct(id){


const confirmDelete =
confirm(
"⚠️ Kya aap is product ko delete karna chahte hain?"
);


if(!confirmDelete){

return;

}


const { error } =
await supabaseClient

.from("products")

.delete()

.eq("id",id);


if(error){

alert(
"❌ Delete failed: "+
error.message
);

return;

}


alert(
"✅ Product Deleted Successfully"
);


loadAdminProducts();

}



/* =========================
   LOGOUT
========================= */


async function logout(){


await supabaseClient
.auth
.signOut();


window.location.href =
"index.html";

}



/* =========================
   START
========================= */


loadAdminProducts();


</script>


</body>

</html>
