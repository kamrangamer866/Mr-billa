<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MR BILLA DLR - Admin Panel</title>

<link rel="stylesheet" href="Style.css">
</head>

<body>

<div class="card">

<h1>🔥 MR BILLA DLR ADMIN 🔥</h1>

<h2>Upload Picture</h2>

<input
    type="file"
    id="imageFile"
    class="input-box"
    accept="image/*"
>

<br><br>

<button onclick="uploadImage()" class="signup-btn">
UPLOAD PICTURE
</button>

<br><br>

<h2>Upload Video</h2>

<input
    type="file"
    id="videoFile"
    class="input-box"
    accept="video/*"
>

<br><br>

<button onclick="uploadVideo()" class="signup-btn">
UPLOAD VIDEO
</button>

<p id="message"></p>

<br>

<a href="Gallery.html" class="start-btn">
VIEW GALLERY
</a>

<br><br>

<button onclick="logout()" class="start-btn">
LOGOUT
</button>

<footer>
© 2026 MR BILLA DLR
</footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script>

async function checkAdmin() {

    const { data } = await supabase.auth.getSession();

    if (!data.session) {
        window.location.href = "login.html";
        return;
    }
}

checkAdmin();


// =========================
// UPLOAD PICTURE
// =========================

async function uploadImage() {

    const file = document.getElementById("imageFile").files[0];

    if (!file) {
        alert("Please select a picture first.");
        return;
    }

    const message = document.getElementById("message");

    message.textContent = "Uploading picture...";

    const fileName =
        Date.now() + "_" + file.name;

    const { error } = await supabase.storage
        .from("uploads")
        .upload("images/" + fileName, file);

    if (error) {

        message.textContent =
            "Upload failed: " + error.message;

        return;
    }

    message.textContent =
        "✅ Picture uploaded successfully!";

    document.getElementById("imageFile").value = "";
}


// =========================
// UPLOAD VIDEO
// =========================

async function uploadVideo() {

    const file = document.getElementById("videoFile").files[0];

    if (!file) {
        alert("Please select a video first.");
        return;
    }

    const message = document.getElementById("message");

    message.textContent = "Uploading video...";

    const fileName =
        Date.now() + "_" + file.name;

    const { error } = await supabase.storage
        .from("uploads")
        .upload("videos/" + fileName, file);

    if (error) {

        message.textContent =
            "Upload failed: " + error.message;

        return;
    }

    message.textContent =
        "✅ Video uploaded successfully!";

    document.getElementById("videoFile").value = "";
}


// =========================
// LOGOUT
// =========================

async function logout() {

    await supabase.auth.signOut();

    window.location.href = "index.html";
}

</script>

</body>
</html>
