<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Product Details - MR BILLA DLR</title>

<link rel="stylesheet" href="Style.css">

</head>


<body>


<div class="card">


<h1 id="productName">
Product
</h1>


<div id="mediaCounter"
style="margin-bottom:10px;">
</div>


<div id="mediaContainer">
Loading...
</div>


<br>


<div
id="mediaDetail"
style="
padding:15px;
margin-top:15px;
border-radius:10px;
background:#181818;
">

</div>


<br>


<h2 id="productPrice">
</h2>


<p id="productDescription">
</p>


<p id="productViews">
</p>


<br>


<button
id="prevBtn"
class="signup-btn">

⬅ Previous

</button>


<button
id="nextBtn"
class="signup-btn">

Next ➡

</button>


<br><br>


<a
href="Gallery.html"
class="start-btn">

⬅ Back To Gallery

</a>


<br><br>


<button
id="deleteBtn"
class="signup-btn"
style="
display:none;
background:red;
">

🗑 DELETE PRODUCT

</button>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>


/* =========================
   GET SELECTED PRODUCT
========================= */


const savedProduct =
localStorage.getItem("selectedProduct");


if(!savedProduct){

alert("❌ Product not found");

window.location.href =
"Gallery.html";

}


const product =
JSON.parse(savedProduct);


let currentIndex = 0;


const media =
Array.isArray(product.media)
? product.media
: [];



/* =========================
   PRODUCT INFORMATION
========================= */


document.getElementById(
"productName"
).innerText =
"📦 " + (product.name || "Product");


document.getElementById(
"productPrice"
).innerText =
"💰 Price: " + (product.price || "");


document.getElementById(
"productDescription"
).innerText =
product.description || "";


document.getElementById(
"productViews"
).innerText =
"👁 Views: " + (product.views || 0);



/* =========================
   SHOW MEDIA
========================= */


function showMedia(){


const container =
document.getElementById(
"mediaContainer"
);


const detailBox =
document.getElementById(
"mediaDetail"
);


const counter =
document.getElementById(
"mediaCounter"
);


container.innerHTML = "";


detailBox.innerHTML = "";



if(media.length === 0){

container.innerHTML =
"<h3>📷 No Media Available</h3>";

return;

}



const item =
media[currentIndex];



/* MEDIA COUNTER */


counter.innerText =
"📁 Media " +
(currentIndex + 1) +
" / " +
media.length;



/* =========================
   IMAGE
========================= */


if(item.type === "image"){


container.innerHTML = `

<img

src="${item.url}"

alt="Product Image"

style="

width:100%;

max-height:500px;

object-fit:contain;

border-radius:10px;

">

`;

}



/* =========================
   VIDEO
========================= */


else if(item.type === "video"){


container.innerHTML = `

<video

controls

style="

width:100%;

max-height:500px;

border-radius:10px;

">

<source

src="${item.url}"

type="video/mp4">

Your browser does not support video.

</video>

`;

}



/* =========================
   MEDIA DETAIL
========================= */


detailBox.innerHTML = `

<h3>📝 Media Detail</h3>

<p>

${
item.detail ||
"No detail added for this media."
}

</p>

`;



/* =========================
   BUTTON STATES
========================= */


document.getElementById(
"prevBtn"
).disabled =
currentIndex === 0;


document.getElementById(
"nextBtn"
).disabled =
currentIndex === media.length - 1;

}



/* =========================
   NEXT BUTTON
========================= */


document.getElementById(
"nextBtn"
).onclick =
function(){


if(currentIndex <
media.length - 1){

currentIndex++;

showMedia();

}

};



/* =========================
   PREVIOUS BUTTON
========================= */


document.getElementById(
"prevBtn"
).onclick =
function(){


if(currentIndex > 0){

currentIndex--;

showMedia();

}

};



/* =========================
   UPDATE VIEWS
========================= */


async function updateViews(){


const newViews =
(product.views || 0) + 1;


const { error } =
await supabaseClient

.from("products")

.update({

views:newViews

})

.eq("id",product.id);


if(!error){


product.views =
newViews;


document.getElementById(
"productViews"
).innerText =
"👁 Views: " + newViews;


localStorage.setItem(
"selectedProduct",
JSON.stringify(product)
);

}

}



/* =========================
   ADMIN DELETE BUTTON
========================= */


async function enableDeleteButton(){


const { data, error } =
await supabaseClient
.auth
.getSession();


if(error){

console.error(error);

return;

}


if(
data.session &&
data.session.user.email &&
data.session.user.email.toLowerCase()
===
"kamrangamer866@gmail.com"
){


const deleteBtn =
document.getElementById(
"deleteBtn"
);


deleteBtn.style.display =
"block";



deleteBtn.onclick =
async function(){


const confirmDelete =
confirm(
"⚠️ Kya aap is Product ko delete karna chahte hain?"
);


if(!confirmDelete){

return;

}


deleteBtn.disabled =
true;


deleteBtn.innerText =
"Deleting...";


const { error } =
await supabaseClient

.from("products")

.delete()

.eq("id",product.id);


if(error){


alert(
"❌ Delete failed: " +
error.message
);


deleteBtn.disabled =
false;


deleteBtn.innerText =
"🗑 DELETE PRODUCT";


return;

}


localStorage.removeItem(
"selectedProduct"
);


alert(
"✅ Product Deleted Successfully"
);


window.location.href =
"Gallery.html";

};

}

}



/* =========================
   START
========================= */


showMedia();

updateViews();

enableDeleteButton();


</script>


</body>

</html>
