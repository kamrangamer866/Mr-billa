<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>MR BILLA DLR - Reset Password</title>

<link rel="stylesheet"
      href="Style.css">

</head>


<body>


<div class="card">


<h1>🔑 RESET PASSWORD</h1>


<form id="resetForm">


<input
    type="password"
    id="password"
    class="input-box"
    placeholder="Enter New Password"
    minlength="6"
    required
>


<br><br>


<input
    type="password"
    id="confirmPassword"
    class="input-box"
    placeholder="Confirm New Password"
    minlength="6"
    required
>


<br><br>


<button
    type="submit"
    class="signup-btn">

UPDATE PASSWORD

</button>


</form>


<p id="message"></p>


<br>


<a href="login.html"
   class="start-btn">

BACK TO LOGIN

</a>


<footer>

© 2026 MR BILLA DLR

</footer>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>


const resetForm =
    document.getElementById("resetForm");


const message =
    document.getElementById("message");


resetForm.addEventListener(
    "submit",
    async function(event) {


        event.preventDefault();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        if (password !== confirmPassword) {

            message.textContent =
                "❌ Passwords do not match.";

            return;

        }


        message.textContent =
            "Updating password...";


        try {


            if (
                typeof supabaseClient ===
                "undefined"
            ) {

                message.textContent =
                    "❌ Supabase connection not found.";

                return;

            }


            const { error } =
                await supabaseClient.auth
                .updateUser({

                    password: password

                });


            if (error) {

                message.textContent =
                    "❌ " + error.message;

                return;

            }


            message.textContent =
                "✅ Password updated successfully!";


            resetForm.reset();


            setTimeout(function() {

                window.location.href =
                    "login.html";

            }, 1500);


        }

        catch (error) {

            console.error(error);

            message.textContent =
                "❌ " + error.message;

        }

    }

);

</script>


</body>

</html>
